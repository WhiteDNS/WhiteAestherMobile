name: Android and Rust toolchain
description: >-
  Installs the Java, Android SDK/NDK and Rust toolchain both the CI and release
  workflows need. Kept in one place so the two cannot drift apart and produce
  builds from different compilers.

inputs:
  rust-components:
    description: Extra Rust components, for example "rustfmt, clippy"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Configure Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Install Android SDK tools
      uses: android-actions/setup-android@v4
      with:
        # Not the action's default of "tools platform-tools". `tools` is the
        # obsolete SDK Tools package, which Google has since removed from the
        # repository -- sdkmanager now exits 1 on it and takes the whole job
        # with it, which is what broke every run from 2026-09-15. Everything
        # this build actually needs is installed by name in the next step.
        packages: platform-tools

    - name: Install Android platform, NDK and CMake
      shell: bash
      run: |
        set +o pipefail
        yes | sdkmanager --licenses >/dev/null
        set -o pipefail
        sdkmanager \
          "platforms;android-36" \
          "platforms;android-37.2" \
          "build-tools;36.0.0" \
          "platform-tools" \
          "ndk;29.0.14206865" \
          "cmake;3.22.1"

    - name: Install native host dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y clang libclang-dev ninja-build cmake

    # The tag is the compiler version, and it has to match
    # native/rust-toolchain.toml: Aether 2.0.0 declares rust-version 1.98, and
    # cargo refuses to build it with anything older. dependabot is configured to
    # leave this alone, because bumping it here silently changes what the
    # release is built with.
    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: ${{ inputs.rust-components }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --version 4.1.2 --locked
