name: build, test and release

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteaesther-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  RUST_VERSION: "1.88.0"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "29.0.14206865"
  ANDROID_CMAKE: "3.22.1"

jobs:
  quality:
    name: Test and build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out WhiteAestherMobile
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android platform, NDK and CMake
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Install native host dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev ninja-build cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path native/aether/aether/Cargo.toml --check
          cargo fmt --manifest-path native/android-bridge/Cargo.toml --check

      - name: Test and lint the native bridge
        run: |
          cargo test --manifest-path native/android-bridge/Cargo.toml --locked
          cargo clippy --manifest-path native/android-bridge/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test, lint and package Android
        run: >-
          ./gradlew
          testPreviewDebugUnitTest
          lintPreviewDebug
          assemblePreviewDebug
          assemblePreviewDebugAndroidTest

      - name: Verify split APKs, universal APK and VPN manifest
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/preview/debug"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="${apk_dir}/app-preview-${abi}-debug.apk"
            test -f "$apk"
            jar tf "$apk" | grep -F "lib/${abi}/libwhiteaesther_core.so"
            test "$(jar tf "$apk" | grep -c '^lib/.*/libwhiteaesther_core\.so$')" -eq 1
            ! jar tf "$apk" | grep -E 'lib(quiche|boringtun.*)\.so'
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" \
              dump xmltree --file AndroidManifest.xml "$apk" | grep -F 'AetherVpnService'
          done

          universal="${apk_dir}/app-preview-universal-debug.apk"
          test -f "$universal"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            jar tf "$universal" | grep -F "lib/${abi}/libwhiteaesther_core.so"
          done
          test "$(jar tf "$universal" | grep -c '^lib/.*/libwhiteaesther_core\.so$')" -eq 3
          ! jar tf "$universal" | grep -E 'lib(quiche|boringtun.*)\.so'

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/package-lock.json

      - name: Verify design prototype
        run: |
          npm --prefix design ci
          # The published page cannot declare a charset, so any multi-byte
          # character in the source comes out as mojibake on screen.
          node -e "const n=[...require('fs').readFileSync('design/src.html','utf8')].filter(c=>c.codePointAt(0)>127).length; if (n) { console.error('design/src.html has ' + n + ' non-ASCII characters'); process.exit(1) }"
          node design/build.mjs
          # index.html is generated and committed; a stale copy means the
          # prototype on disk is not the one the source describes.
          git diff --exit-code -- design/index.html

      - name: Upload preview APK and reports
        uses: actions/upload-artifact@v7
        with:
          name: whiteaesther-android-preview
          path: |
            app/build/outputs/apk/preview/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-previewDebug.html
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build signed stable APK and publish
    needs: quality
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out WhiteAestherMobile
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android platform, NDK and CMake
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev ninja-build cmake

      - name: Install Rust and cargo-ndk
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whiteaesther-release.jks"

      - name: Resolve Android release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.1.0-continuous.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build signed stable APKs and app bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          common_args=(
            "-PWHITEAESTHER_VERSION_NAME=${{ steps.version.outputs.name }}"
            "-PWHITEAESTHER_VERSION_CODE=${{ steps.version.outputs.code }}"
            "-PWHITEAESTHER_KEYSTORE_PATH=$RUNNER_TEMP/whiteaesther-release.jks"
            "-PWHITEAESTHER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            "-PWHITEAESTHER_KEY_ALIAS=$KEY_ALIAS"
            "-PWHITEAESTHER_KEY_PASSWORD=$KEY_PASSWORD"
          )
          ./gradlew assembleStableRelease "${common_args[@]}"
          ./gradlew bundleStableRelease -PWHITEAESTHER_DISABLE_ABI_SPLITS=true "${common_args[@]}"

      - name: Verify signatures, ABIs and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base="WhiteAestherMobile-${GITHUB_REF_NAME#v}"
          else
            base="WhiteAestherMobile-continuous"
          fi

          apk_dir="app/build/outputs/apk/stable/release"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            source_apk="${apk_dir}/app-stable-${abi}-release.apk"
            test -f "$source_apk"
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$source_apk"
            jar tf "$source_apk" | grep -F "lib/${abi}/libwhiteaesther_core.so"
            test "$(jar tf "$source_apk" | grep -c '^lib/.*/libwhiteaesther_core\.so$')" -eq 1
            cp "$source_apk" "release-assets/${base}-${abi}.apk"
          done

          universal="${apk_dir}/app-stable-universal-release.apk"
          test -f "$universal"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$universal"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            jar tf "$universal" | grep -F "lib/${abi}/libwhiteaesther_core.so"
          done
          test "$(jar tf "$universal" | grep -c '^lib/.*/libwhiteaesther_core\.so$')" -eq 3
          cp "$universal" "release-assets/${base}-universal.apk"

          source_aab="app/build/outputs/bundle/stableRelease/app-stable-release.aab"
          test -f "$source_aab"
          jarsigner -verify "$source_aab"
          cp "$source_aab" "release-assets/${base}-bundle.aab"

          cd release-assets
          sha256sum ./*.apk ./*.aab > SHA256SUMS

      - name: Upload signed stable packages
        uses: actions/upload-artifact@v7
        with:
          name: whiteaesther-android-stable
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged or continuous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" release-assets/* --clobber
            else
              gh release create "$tag" release-assets/* \
                --verify-tag --generate-notes --title "WhiteAestherMobile $tag"
            fi
            exit 0
          fi

          tag="continuous"
          title="WhiteAesther Android continuous build"
          notes="Signed Android package from commit ${GITHUB_SHA}. The matching source is this repository at that commit."
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --title "$title" --notes "$notes" --prerelease
          fi
